name: Y Pro build diagnostics
on:
  push:
    branches: [fix/build-diagnostics]
permissions:
  actions: read
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve compiler failure from the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/retro-citizen/gow3_android/actions/jobs/139314126851/logs > build.log 2> api-error.log || true
          tail -350 build.log > compiler-tail.txt
          python3 - <<'PY'
          from pathlib import Path
          for name in ['api-error.log', 'compiler-tail.txt']:
              text = Path(name).read_text(errors='replace')[-55000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={name}::{text}')
          PY
